[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-framework"
version = "1.0.0"
description = "Institutional Market Risk Modelling, Backtesting & Derivatives Stress-Testing Framework (Python + C++17 Kernel)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mukund Ankit" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
