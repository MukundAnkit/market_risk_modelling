name: Market Risk Engine CI

on:
  push:
    branches: [ main, dev, "feat/**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-verify:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build C++17 Quantitative Kernel
        run: |
          python -c "from src.cpp_kernel import get_kernel; k = get_kernel(); print('C++17 kernel loaded:', k is not None)"

      - name: Run Unit Test Suite
        run: |
          pytest tests/ -v
